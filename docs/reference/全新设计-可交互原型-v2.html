<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDV Tool · 全新界面设计 v2（可交互原型）</title>
<style>
:root{
  --bg:#0A0C10; --bg-2:#0E1116; --surface:#141820; --surface-2:#191E28;
  --surface-3:#202734; --line:#242C39; --line-soft:#1C232E; --line-strong:#364152;
  --text:#F0F4FA; --text-2:#A9B6C8; --text-3:#73829A;
  --accent:#6AA9FF; --accent-2:#4C7DF0; --accent-soft:rgba(106,169,255,.13);
  --ok:#4ADE9B; --ok-soft:rgba(74,222,155,.11);
  --warn:#F5C565; --warn-soft:rgba(245,197,101,.11);
  --bad:#FF7285; --bad-soft:rgba(255,114,133,.11);
  --idle:#8293AB; --idle-soft:rgba(130,147,171,.11);
  --heart:#FF8FA8; --heart-2:#FFC078; --heart-soft:rgba(255,143,168,.11);
  --mono:"Cascadia Mono","SF Mono","Consolas",ui-monospace,monospace;
  --sans:"Inter","Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-s:5px; --r-m:9px; --r-l:13px;
  --shadow:0 20px 56px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#F4F6FA; --bg-2:#EDF1F7; --surface:#FFFFFF; --surface-2:#F6F8FC;
  --surface-3:#EAEFF6; --line:#E0E6EF; --line-soft:#EAEFF5; --line-strong:#C6D0DE;
  --text:#151C28; --text-2:#4E5C70; --text-3:#7A889C;
  --accent:#2563EB; --accent-2:#1D4ED8; --accent-soft:rgba(37,99,235,.09);
  --ok:#0E8A57; --ok-soft:rgba(14,138,87,.09);
  --warn:#9A6B00; --warn-soft:rgba(154,107,0,.09);
  --bad:#D43A50; --bad-soft:rgba(212,58,80,.09);
  --idle:#5C6B80; --idle-soft:rgba(92,107,128,.09);
  --heart-soft:rgba(230,90,125,.09);
  --shadow:0 20px 56px rgba(24,38,64,.16);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}

.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ================= 标题栏：只做标题栏该做的事 ================= */
.titlebar{
  height:58px;flex:none;display:flex;align-items:center;gap:0;
  background:var(--bg-2);border-bottom:1px solid var(--line);padding-left:18px;position:relative;z-index:20;
}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:208px;user-select:none;}
.brand-mark{
  width:29px;height:29px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-weight:800;font-size:14px;letter-spacing:-.06em;
  box-shadow:0 3px 12px var(--accent-soft);
}
.brand-name{font-size:13.5px;font-weight:700;line-height:1.15;letter-spacing:.01em;}
.ver-chip{
  font-family:var(--mono);font-size:9px;color:var(--text-3);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px;
}
.tb-center{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding-left:22px;}
.tb-page{font-size:13px;font-weight:650;white-space:nowrap;}
.tb-sep{width:1px;height:16px;background:var(--line-strong);}
.tb-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-3);white-space:nowrap;}
.tb-led{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
.tb-right{display:flex;align-items:center;gap:7px;padding-right:0;}
.tb-btn{
  height:32px;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:11.5px;white-space:nowrap;
}
.tb-btn:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2);}
.tb-heart{
  border-color:rgba(255,143,168,.34);background:linear-gradient(135deg,var(--heart-soft),transparent);
  color:var(--heart);font-weight:600;
}
.tb-heart:hover{border-color:var(--heart);background:var(--heart-soft);color:var(--heart);}
.tb-icon{width:32px;height:32px;padding:0;justify-content:center;font-size:13px;}
.tb-pal-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.winbtns{display:flex;align-items:center;height:58px;margin-left:6px;border-left:1px solid var(--line);}
.winbtn{width:42px;height:100%;display:grid;place-items:center;color:var(--text-3);font-size:12px;}
.winbtn:hover{background:var(--surface-3);color:var(--text);}
.winbtn.close:hover{background:var(--bad);color:#fff;}

/* ================= 主体 ================= */
.body{flex:1;display:flex;min-height:0;}
.sidebar{
  width:208px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 10px 12px;gap:3px;
}
.nav-label{font-size:10px;letter-spacing:.14em;color:var(--text-3);font-weight:700;padding:6px 12px 8px;text-transform:uppercase;}
.nav-item{
  height:40px;display:flex;align-items:center;gap:11px;padding:0 12px;border-radius:var(--r-m);
  color:var(--text-2);font-size:12.5px;font-weight:550;position:relative;text-align:left;width:100%;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--surface-3);color:var(--text);font-weight:650;}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.nav-item.active .nav-ico{color:var(--accent);}
.nav-ico{width:17px;text-align:center;font-size:14px;flex:none;color:var(--text-3);}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);background:var(--surface-3);border-radius:4px;padding:1px 6px;}
.nav-item.active .nav-count{color:var(--accent);}
.side-spacer{flex:1;min-height:12px;}

/* 明显的「支持作者」卡片 */
.donate-card{
  position:relative;overflow:hidden;text-align:left;width:100%;margin-bottom:10px;
  border:1px solid rgba(255,143,168,.3);border-radius:var(--r-l);
  background:linear-gradient(135deg,var(--heart-soft),rgba(255,192,120,.05));
  padding:13px 13px 12px;transition:border-color .15s,transform .12s;
}
.donate-card:hover{border-color:var(--heart);transform:translateY(-2px);}
.donate-card::after{
  content:"♥";position:absolute;right:-6px;top:-16px;font-size:62px;line-height:1;
  color:var(--heart);opacity:.09;transform:rotate(-14deg);
}
.dc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.dc-ico{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;
  background:linear-gradient(135deg,var(--heart),var(--heart-2));color:#241016;
}
.dc-title{font-size:12px;font-weight:700;color:var(--heart);}
.dc-sub{font-size:10.5px;color:var(--text-3);line-height:1.5;}
.dc-go{position:absolute;right:12px;top:16px;font-size:12px;color:var(--heart);opacity:.8;}
.side-foot{display:flex;gap:6px;}
.side-foot button{
  flex:1;height:31px;border:1px solid var(--line);border-radius:var(--r-s);
  color:var(--text-2);font-size:11px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.side-foot button:hover{border-color:var(--line-strong);background:var(--surface-2);color:var(--text);}

.main{flex:1;min-width:0;overflow-y:auto;background:var(--bg);}
.main-inner{max-width:1280px;margin:0 auto;padding:22px 30px 48px;}

/* ================= 捕获区（只在工作台出现） ================= */
.capture-hero{
  border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:20px;
  background:linear-gradient(150deg,var(--surface),var(--bg-2));
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
}
.ch-head{display:flex;align-items:flex-start;gap:14px;padding:16px 20px 12px;}
.ch-title{font-size:14px;font-weight:700;letter-spacing:-.01em;}
.ch-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.ch-badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.ch-badge{font-size:10px;color:var(--text-2);border:1px solid var(--line);border-radius:var(--r-s);padding:3px 8px;background:var(--surface-2);white-space:nowrap;}
.ch-badge b{color:var(--accent);font-weight:600;}
.ch-input{
  margin:0 20px;height:48px;display:flex;align-items:center;gap:0;
  background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-m);
  padding:0 5px 0 14px;transition:border-color .15s,box-shadow .15s;
}
.ch-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ch-input.dragover{border-color:var(--ok);background:var(--ok-soft);}
.ch-ico{color:var(--accent);font-size:16px;flex:none;margin-right:10px;}
#urlInput{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px;}
#urlInput::placeholder{color:var(--text-3);}
.mini-btn{color:var(--text-3);font-size:11px;padding:5px 9px;border-radius:var(--r-s);flex:none;}
.mini-btn:hover{background:var(--surface-3);color:var(--text);}
.btn-primary{
  height:38px;padding:0 17px;border-radius:var(--r-s);font-weight:650;font-size:12.5px;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none;margin-left:5px;
  box-shadow:0 3px 12px var(--accent-soft);transition:filter .15s,transform .12s;
}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.ch-foot{display:flex;align-items:center;gap:10px;padding:11px 20px 14px;flex-wrap:wrap;min-height:44px;}
.detect-chip{
  display:none;align-items:center;gap:7px;font-size:11px;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 9px;
}
.detect-chip.show{display:flex;}
.detect-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
.ch-hint{font-size:10.5px;color:var(--text-3);}
.ch-foot .tbtn{margin-left:auto;}

/* ================= 仪表盘 ================= */
.dash{
  display:grid;grid-template-columns:minmax(210px,1.05fr) minmax(190px,1fr) repeat(3,minmax(112px,.6fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:18px;
}
.dash-cell{background:var(--surface);padding:14px 18px;min-height:90px;}
.dash-hero{display:flex;flex-direction:column;justify-content:center;}
.dash-kicker{font-size:10px;letter-spacing:.12em;color:var(--text-3);text-transform:uppercase;font-weight:700;margin-bottom:4px;}
.big-num{font-family:var(--mono);font-size:33px;font-weight:600;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums;}
.big-num .unit{font-size:13px;color:var(--text-3);letter-spacing:0;margin-left:5px;font-weight:400;}
.big-num.accent{color:var(--accent);}
.dash-hero .sub{font-size:11px;color:var(--text-3);margin-top:5px;}
.spark-wrap{display:flex;flex-direction:column;justify-content:center;height:100%;gap:6px;}
.spark{width:100%;height:44px;display:block;}
.spark-meta{font-size:10px;color:var(--text-3);display:flex;justify-content:space-between;font-family:var(--mono);}
.dash-metric{display:flex;flex-direction:column;justify-content:center;gap:7px;}
.dash-metric .val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.dash-metric .cap{font-size:10.5px;color:var(--text-3);}
.dash-metric .bar{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden;}
.dash-metric .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}

/* ================= 工具条 ================= */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;gap:2px;}
.seg button{height:28px;padding:0 12px;border-radius:var(--r-s);font-size:11.5px;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.seg button:hover{color:var(--text);background:var(--surface-2);}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600;}
.seg button.on .dot{background:var(--accent);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);}
.search{height:34px;width:190px;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);color:var(--text-3);}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:11.5px;}
.search input::placeholder{color:var(--text-3);}
.tool-spacer{flex:1;}
.tbtn{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--text-2);font-size:11.5px;display:flex;align-items:center;gap:6px;}
.tbtn:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2);}
.tbtn.danger:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);}
.tbtn.muted{opacity:.52;}
.tbtn.muted:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
select.sel{
  height:34px;padding:0 26px 0 10px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--surface);color:var(--text-2);font-size:11.5px;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 15px,calc(100% - 10px) 15px;background-size:4px 4px;background-repeat:no-repeat;
}
.batch-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-m);font-size:11.5px;}
.batch-bar b{color:var(--accent);font-family:var(--mono);}

.sec-head{display:flex;align-items:center;gap:9px;margin:20px 0 10px;}
.sec-head h3{font-size:12px;font-weight:700;margin:0;letter-spacing:.02em;}
.sec-head .cnt{font-family:var(--mono);font-size:10px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;}
.sec-head .rule{flex:1;height:1px;background:var(--line-soft);}
.sec-head button{font-size:11px;color:var(--text-3);}
.sec-head button:hover{color:var(--accent);}

/* ================= 任务卡 ================= */
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:15px 16px 13px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color .15s;}
.task-card:hover{border-color:var(--line-strong);}
.task-card.sel{border-color:var(--accent);}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);}
.task-card.st-paused::before{background:var(--warn);}
.task-card.st-failed::before{background:var(--bad);}
.tc-top{display:flex;gap:12px;align-items:flex-start;}
.chk{width:15px;height:15px;flex:none;margin-top:5px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;font-size:10px;color:transparent;cursor:pointer;}
.chk:hover{border-color:var(--accent);}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.file-ico{width:38px;height:38px;flex:none;border-radius:var(--r-m);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;}
.fi-model{background:var(--accent-soft);color:var(--accent);}
.fi-video{background:rgba(140,150,255,.13);color:#9AA4FF;}
.fi-zip{background:var(--warn-soft);color:var(--warn);}
.fi-app{background:rgba(90,190,240,.13);color:#5ABEF0;}
.fi-bt{background:var(--ok-soft);color:var(--ok);}
.tc-info{flex:1;min-width:0;}
.tc-name{font-size:13px;font-weight:650;word-break:break-all;line-height:1.4;}
.tc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:10.5px;color:var(--text-3);}
.tc-meta .path{font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:4px;padding:1px 6px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-right{text-align:right;flex:none;min-width:112px;}
.tc-speed{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.tc-speed .u{font-size:10px;color:var(--text-3);margin-left:3px;font-weight:400;letter-spacing:0;}
.tc-eta{font-size:10.5px;color:var(--text-3);margin-top:2px;font-family:var(--mono);}
.tc-prog{margin-top:13px;display:flex;align-items:center;gap:11px;}
.track{flex:1;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.track > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s linear;position:relative;}
.track > i::after{content:"";position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);background-size:80px 100%;animation:flow 1.6s linear infinite;}
@keyframes flow{from{background-position:-80px 0;}to{background-position:320px 0;}}
.tc-pct{font-family:var(--mono);font-size:12px;font-weight:600;width:44px;text-align:right;font-variant-numeric:tabular-nums;}
.tc-foot{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-s);font-size:10.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);}
.pill .pd{width:5px;height:5px;border-radius:50%;background:currentColor;}
.p-active{color:var(--accent);}.p-queued{color:var(--idle);}
.p-done{color:var(--ok);}.p-paused{color:var(--warn);}.p-failed{color:var(--bad);}
.tc-actions{margin-left:auto;display:flex;gap:5px;}
.abtn{height:27px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r-s);font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px;background:var(--surface);}
.abtn:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2);}
.abtn.danger:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);}
.abtn.icon{width:27px;padding:0;justify-content:center;font-size:12px;}
.row{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:6px;}
.row:hover{border-color:var(--line-strong);}
.row.sel{border-color:var(--accent);}
.row .r-name{flex:1;min-width:0;font-size:12px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .r-sub{font-size:10.5px;color:var(--text-3);font-family:var(--mono);white-space:nowrap;}
.row .r-size{font-family:var(--mono);font-size:11px;color:var(--text-2);width:78px;text-align:right;white-space:nowrap;}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-l);padding:42px 20px;text-align:center;color:var(--text-3);background:var(--surface);}
.empty .glyph{font-size:28px;opacity:.5;margin-bottom:10px;}
.empty h4{margin:0 0 6px;font-size:13px;color:var(--text-2);font-weight:600;}
.empty p{margin:0;font-size:11.5px;}

/* ================= 页面头 / 设置 ================= */
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;}
.page-head h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em;}
.page-head p{margin:0 0 3px;color:var(--text-3);font-size:11.5px;}
.settings-wrap{max-width:1000px;}
.settings-layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start;}
.set-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;}
.set-nav button{text-align:left;height:34px;padding:0 11px;border-radius:var(--r-s);font-size:11.5px;color:var(--text-2);}
.set-nav button:hover{background:var(--surface-2);color:var(--text);}
.set-nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:650;}
.set-section{margin-bottom:22px;scroll-margin-top:8px;}
.set-title{font-size:12px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:9px;}
.set-title::after{content:"";flex:1;height:1px;background:var(--line);}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;}
.set-row{display:flex;align-items:center;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line-soft);}
.set-row:last-child{border-bottom:0;}
.set-row:hover{background:var(--surface-2);}
.set-label{flex:1;min-width:0;}
.set-label .t{font-size:12.5px;font-weight:600;}
.set-label .d{font-size:10.8px;color:var(--text-3);margin-top:2px;line-height:1.55;}
.set-ctl{flex:none;display:flex;align-items:center;gap:7px;max-width:48%;justify-content:flex-end;flex-wrap:wrap;}
.sw{width:36px;height:20px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-strong);position:relative;transition:background .16s,border-color .16s;flex:none;}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--text-3);transition:transform .16s,background .16s;}
.sw.on{background:var(--accent);border-color:var(--accent);}
.sw.on::after{transform:translateX(16px);background:#fff;}
.pathbox{display:flex;align-items:center;gap:8px;min-width:250px;max-width:330px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 9px;}
.pathbox span{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.src-note{font-size:10.5px;color:var(--ok);display:flex;align-items:center;gap:5px;}
.set-actions{
  position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;margin-top:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
}
.donate-row{
  display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid rgba(255,143,168,.3);
  border-radius:var(--r-m);background:linear-gradient(120deg,var(--heart-soft),transparent);margin-top:12px;
}
.donate-row .dr-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,var(--heart),var(--heart-2));color:#241016;flex:none;}

/* 文件库 / BT */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;}
.lib-folder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;text-align:left;transition:border-color .15s,transform .12s;}
.lib-folder:hover{border-color:var(--accent);transform:translateY(-2px);}
.lib-folder .fico{font-size:19px;margin-bottom:9px;color:var(--accent);}
.lib-folder .fn{font-size:12px;font-weight:650;}
.lib-folder .fm{font-size:10.5px;color:var(--text-3);margin-top:4px;font-family:var(--mono);}
.lib-file{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:5px;text-align:left;width:100%;}
.lib-file:hover{border-color:var(--line-strong);background:var(--surface-2);}
.lib-file .ln{flex:1;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bt-hero{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--r-l);padding:22px;margin-bottom:16px;}
.bt-input{display:flex;gap:8px;margin-top:12px;}
.bt-input input{flex:1;height:40px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:0 13px;outline:none;font-family:var(--mono);font-size:11.5px;}
.bt-input input:focus{border-color:var(--accent);}

/* 状态条 */
.statusbar{height:30px;flex:none;background:var(--bg-2);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:10.5px;color:var(--text-3);z-index:20;}
.sb-item{display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;border-right:1px solid var(--line-soft);white-space:nowrap;}
.sb-item:hover{color:var(--text);background:var(--surface-2);cursor:pointer;}
.sb-spacer{flex:1;}
.sb-tag{font-family:var(--mono);font-size:10px;color:var(--text-3);padding:0 10px;}

/* 抽屉 / 弹层 */
.overlay{position:fixed;inset:0;background:rgba(3,6,11,.62);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;left:208px;right:0;bottom:30px;height:300px;z-index:61;
  background:var(--surface);border-top:1px solid var(--line-strong);
  /* 收起时必须多移一个状态条高度(30px)，否则抽屉头部会露出 30px 压在状态条上 */
  transform:translateY(calc(100% + 30px));
  visibility:hidden;pointer-events:none;
  transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s linear .24s;
  display:flex;flex-direction:column;box-shadow:0 -14px 40px rgba(0,0,0,.3);
}
.drawer.show{
  transform:translateY(0);visibility:visible;pointer-events:auto;
  transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s;
}
.drawer-head{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);}
.drawer-head b{font-size:12px;}
.drawer-body{flex:1;overflow-y:auto;padding:10px 16px;font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--text-2);}
.log-line{display:flex;gap:10px;}
.log-t{color:var(--text-3);flex:none;}.log-i{color:var(--accent);}.log-o{color:var(--ok);}.log-e{color:var(--bad);}
.sheet{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:71;background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;}
.sheet.show{transform:translateX(0);}
.sheet-head{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);}
.sheet-head h3{margin:0;font-size:14px;font-weight:700;}
.sheet-body{flex:1;overflow-y:auto;padding:20px;}
.sheet-foot{flex:none;padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
.xbtn{width:28px;height:28px;border-radius:var(--r-s);color:var(--text-3);font-size:16px;display:grid;place-items:center;}
.xbtn:hover{background:var(--surface-3);color:var(--text);}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:11.5px;}
.kv .k{width:88px;flex:none;color:var(--text-3);}
.kv .v{flex:1;word-break:break-all;font-family:var(--mono);font-size:10.5px;color:var(--text-2);}
.modal{position:fixed;left:50%;top:46%;transform:translate(-50%,-46%) scale(.96);z-index:81;width:390px;max-width:92vw;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-l);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .18s;padding:22px;}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.modal h3{margin:0 0 8px;font-size:15px;}
.modal p{margin:0 0 18px;color:var(--text-2);font-size:12px;line-height:1.7;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.btn-ghost{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-m);font-size:12px;color:var(--text-2);}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2);}
.btn-solid{height:34px;padding:0 15px;border-radius:var(--r-m);font-size:12px;font-weight:600;color:#fff;background:var(--accent);}
.btn-solid:hover{filter:brightness(1.12);}
.btn-solid.danger{background:var(--bad);}
.toasts{position:fixed;right:18px;bottom:44px;z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:var(--surface-2);border:1px solid var(--line-strong);border-left:3px solid var(--accent);border-radius:var(--r-m);padding:10px 14px;font-size:11.5px;color:var(--text);box-shadow:var(--shadow);animation:slidein .22s ease-out;max-width:340px;}
.toast.ok{border-left-color:var(--ok);}.toast.bad{border-left-color:var(--bad);}
@keyframes slidein{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
.popover{position:fixed;z-index:90;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-m);box-shadow:var(--shadow);padding:7px;min-width:172px;display:none;}
.popover.show{display:block;}
.popover button{display:flex;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-s);font-size:11.5px;color:var(--text-2);}
.popover button:hover{background:var(--surface-3);color:var(--text);}
.popover button.on{color:var(--accent);font-weight:600;}
.pop-title{font-size:10px;color:var(--text-3);padding:5px 10px 7px;letter-spacing:.08em;text-transform:uppercase;}
.pal-dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:9px;flex:none;}
/* ===== 统一图标系统：全部 24x24 线性 SVG / 1.8 stroke / currentColor =====
   不再使用 Unicode 符号（◈▤◷◉⚙）或 emoji（📁♥☀），避免字形、粗细、大小、语义不一致 */
.ico{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-.18em;}
.ico.xs{width:11px;height:11px;}
.ico.sm{width:13px;height:13px;}
.ico.lg{width:19px;height:19px;}
.nav-ico .ico{width:17px;height:17px;vertical-align:0;}
.tb-btn .ico,.tbtn .ico,.abtn .ico,.btn-primary .ico{width:14px;height:14px;vertical-align:-.16em;}
.sb-item .ico{width:12px;height:12px;vertical-align:-.14em;}
.winbtn .ico{width:13px;height:13px;vertical-align:0;}
.mini-btn .ico{width:12px;height:12px;vertical-align:-.12em;}
.ch-ico .ico,.ch-ico{width:17px;height:17px;}
.chk .ico{width:11px;height:11px;vertical-align:0;}
.dc-ico .ico,.dr-ico .ico{width:16px;height:16px;vertical-align:0;}
.pill .ico{width:11px;height:11px;vertical-align:-.1em;}
.fico .ico{width:20px;height:20px;vertical-align:0;}
.empty .glyph .ico{width:30px;height:30px;opacity:.55;}
.flash{animation:flash 1s ease-out;}
@keyframes flash{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent);}}

/* 设计说明 */
.doc h4{font-size:12px;margin:22px 0 8px;color:var(--text);}
.doc h4:first-child{margin-top:0;}
.doc p{font-size:11.5px;color:var(--text-2);line-height:1.8;margin:0 0 10px;}
.doc ul{margin:0 0 12px;padding-left:18px;}
.doc li{font-size:11.5px;color:var(--text-2);line-height:1.85;margin-bottom:3px;}
.doc code{font-family:var(--mono);font-size:10.5px;background:var(--surface-3);padding:1px 5px;border-radius:3px;color:var(--accent);}
.fb{display:flex;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);margin-bottom:8px;}
.fb .fi{font-size:14px;flex:none;color:var(--ok);}
.fb .ft{font-size:11.5px;font-weight:650;margin-bottom:2px;}
.fb .fd{font-size:10.8px;color:var(--text-3);line-height:1.6;}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;}
.sw-item{width:62px;text-align:center;}
.sw-box{height:34px;border-radius:var(--r-s);border:1px solid var(--line);margin-bottom:4px;}
.sw-cap{font-family:var(--mono);font-size:9px;color:var(--text-3);}
.cmp{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px;}
.cmp th,.cmp td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
.cmp th{color:var(--text-3);font-weight:600;font-size:10px;letter-spacing:.05em;}
.cmp td:first-child{color:var(--text-3);width:78px;}
.donate-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.donate-qr{aspect-ratio:1;border-radius:var(--r-m);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--text-3);background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,var(--surface-3) 8px,var(--surface-3) 16px);}
@media(max-width:1180px){.dash{grid-template-columns:1.2fr 1fr 1fr;}.dash-cell:nth-child(4),.dash-cell:nth-child(5){display:none;}}
@media(max-width:960px){
  .sidebar{width:60px;padding:14px 6px;}
  .nav-item span:not(.nav-ico),.nav-label,.nav-count,.donate-card,.side-foot{display:none;}
  .nav-item{justify-content:center;padding:0;}.nav-item.active::before{left:-6px;}
  .drawer{left:60px;}.tb-brand{min-width:0;}.brand-name,.ver-chip{display:none;}
  .tb-center{padding-left:14px;}.settings-layout{grid-template-columns:1fr;}
  .set-nav{flex-direction:row;flex-wrap:wrap;position:static;}
}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar" id="titlebar"></header>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"><div class="main-inner" id="mainInner"></div></main>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <b>运行日志</b><span style="font-size:10.5px;color:var(--text-3)">最近 500 条 · 自动滚到最新</span>
    <div style="flex:1"></div>
    <button class="mini-btn" data-act="log-copy">复制</button>
    <button class="mini-btn" data-act="log-clear">清空</button>
    <button class="xbtn" data-act="log-toggle" title="收起" data-icon="x"></button>
  </div>
  <div class="drawer-body" id="logBody"></div>
</div>
<div class="sheet" id="sheet">
  <div class="sheet-head"><h3 id="sheetTitle">详情</h3><button class="xbtn" data-act="sheet-close" data-icon="x"></button></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>
<div class="modal" id="modal"></div>
<div class="popover" id="popover"></div>
<div class="toasts" id="toasts"></div>

<script>
/* MDV Tool 全新界面 v2 · 单文件可交互原型 */

/* ---------- 基础工具 ---------- */
function toast(msg, kind=''){
  const el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:'');el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(16px)';el.style.transition='all .2s';setTimeout(()=>el.remove(),220);},2600);
}
function log(msg, kind='i'){
  const t=new Date().toTimeString().slice(0,8);
  S.logs.push([t,kind,msg]);if(S.logs.length>500)S.logs.shift();renderLog();
}
function renderLog(){
  if(!$('#logBody'))return;
  $('#logBody').innerHTML=S.logs.map(([t,k,m])=>`<div class="log-line"><span class="log-t">${esc(t)}</span><span class="log-${k}">${esc(m)}</span></div>`).join('');
  $('#logBody').scrollTop=$('#logBody').scrollHeight;
}
function openOverlay(){$('#overlay').classList.add('show');}
function closeOverlay(){if(!$('#sheet').classList.contains('show')&&!$('#modal').classList.contains('show'))$('#overlay').classList.remove('show');}
function showSheet(title, body, foot=''){
  $('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#sheetFoot').innerHTML=foot;
  $('#sheet').classList.add('show');openOverlay();
}
function closeSheet(){$('#sheet').classList.remove('show');closeOverlay();}
function confirmBox(title, text, buttons){
  $('#modal').innerHTML=`<h3>${esc(title)}</h3><p>${text}</p><div class="modal-btns">${buttons.map((b,i)=>
    `<button class="${b.cls||'btn-ghost'}" data-act="modal-btn" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`;
  S.modalButtons=buttons;$('#modal').classList.add('show');openOverlay();
}
function closeModal(){$('#modal').classList.remove('show');closeOverlay();}
function showPopover(anchor, title, items, current, act){
  const p=$('#popover'),r=anchor.getBoundingClientRect();
  p.innerHTML=`<div class="pop-title">${esc(title)}</div>`+items.map(it=>
    `<button data-act="${act}" data-v="${esc(it)}" class="${it===current?'on':''}">${it===current?ico('check','xs')+' ':''}${esc(it)}</button>`).join('');
  p.style.left=Math.min(r.left,window.innerWidth-200)+'px';p.style.top=(r.bottom+6)+'px';p.classList.add('show');
}
function showPalettePopover(anchor){
  const p=$('#popover'),r=anchor.getBoundingClientRect();

  p.style.left=Math.min(r.left,window.innerWidth-210)+'px';p.style.top=(r.bottom+6)+'px';p.classList.add('show');
}
function hidePopover(){$('#popover').classList.remove('show');}

function sparkSVG(arr){
  const w=200,h=44,max=Math.max(...arr,12);
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-4-(v/max)*(h-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:.28"/>
      <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#sg)"/>
    <polyline points="${pts}" fill="none" style="stroke:var(--accent);stroke-width:1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>`;
}

function typeIco(t){
  const map={model:['fi-model','SF'],video:['fi-video','MP4'],zip:['fi-zip','ZIP'],app:['fi-app','EXE'],bt:['fi-bt','BT']};
  const [cls,label]=map[t.type]||['fi-app','FILE'];
  return `<div class="file-ico ${cls}">${label}</div>`;
}
function statusPill(t){
  const m={active:['p-active','下载中'],queued:['p-queued','排队中'],paused:['p-paused','已暂停'],done:['p-done','已完成'],failed:['p-failed','失败']};
  const [cls,label]=m[t.status];return `<span class="pill ${cls}"><span class="pd"></span>${label}</span>`;
}
function pct(t){return t.size?Math.min(100,t.done/t.size*100):0;}
function etaText(t){
  if(t.status!=='active'||t.speed<=0)return '—';
  const s=(t.size-t.done)/t.speed;
  if(s<60)return Math.ceil(s)+' 秒';
  if(s<3600)return Math.ceil(s/60)+' 分钟';
  return (s/3600).toFixed(1)+' 小时';
}
function actionBtns(t){
  const toggle=t.status==='active'?'暂停':(t.status==='paused'||t.status==='queued'?'继续':null);
  return `<div class="tc-actions">
    ${toggle?`<button class="abtn" data-act="task-toggle" data-id="${t.id}">${ico(toggle==='暂停'?'pause':'play','sm')} ${toggle}</button>`:''}
    ${t.status==='failed'?`<button class="abtn" data-act="task-retry" data-id="${t.id}">${ico('refresh','sm')} 重试</button>`:''}
    <button class="abtn icon" data-act="task-open" data-id="${t.id}" title="在资源管理器打开：${esc(t.folder)}">${ico('folder-open')}</button>
    <button class="abtn icon" data-act="task-copy" data-id="${t.id}" title="复制链接">${ico('copy')}</button>
    <button class="abtn" data-act="task-detail" data-id="${t.id}">详情</button>
    <button class="abtn icon danger" data-act="task-remove" data-id="${t.id}" title="移除">${ico('x')}</button>
  </div>`;
}

    <div class="tc-top">

/* ---------- 下载模拟 ---------- */
let tickCount=0;
function tick(){
  const act=S.tasks.filter(t=>t.status==='active');let changed=false;
  act.forEach(t=>{
    const jitter=0.75+Math.random()*0.5;
    t.speed=Math.max(1.2,Math.min(78,t.speed*0.82+(18+Math.random()*34)*jitter*0.18+t.speed*0.18));
    t.done+=t.speed*0.8;
    if(t.done>=t.size){
      t.done=t.size;t.speed=0;t.status='done';log(`完成 ${t.name}`,'o');toast('下载完成：'+t.name,'ok');changed=true;
      const q=S.tasks.find(x=>x.status==='queued');
      if(q){q.status='active';q.speed=12+Math.random()*20;log(`队列任务开始 ${q.name}`,'i');}
    }
    const card=document.querySelector(`[data-task-card="${t.id}"]`);
    if(card&&t.status==='active'){
      const p=pct(t),set=(f,v)=>{const el=card.querySelector(`[data-field="${f}"]`);if(el)el.innerHTML=v;};
      set('speed',`${t.speed.toFixed(1)}<span class="u">MB/s</span>`);
      set('eta',`剩余 ${etaText(t)}`);set('done',`${fmtSize(t.done)} / ${fmtSize(t.size)}`);set('pct',`${p.toFixed(1)}%`);
      const bar=card.querySelector('[data-field="bar"]');if(bar)bar.style.width=p+'%';
    }
  });
  const total=act.reduce((a,t)=>a+t.speed,0);
  S.spark.push(total);S.spark.shift();
  const ds=$('#dashSpeed');if(ds)ds.innerHTML=`${total.toFixed(1)}<span class="unit">MB/s</span>`;
  const sh=$('#sparkHost');if(sh)sh.innerHTML=sparkSVG(S.spark);
  const sp=$('#sparkPeak');if(sp)sp.textContent=`峰值 ${Math.max(...S.spark).toFixed(0)} MB/s`;
  const da=$('#dashActive');if(da)da.innerHTML=`${S.tasks.filter(t=>t.status==='active').length} <span style="font-size:12px;color:var(--text-3)">/ ${S.tasks.filter(t=>t.status==='queued').length}</span>`;
  tickCount++;
  if(tickCount%12===0)log(`多源吞吐 ${total.toFixed(1)} MB/s · 活跃连接 ${S.tasks.filter(t=>t.status==='active').length*16}`,'i');
  if(changed)renderMain();
}

/* ---------- 链接识别 ---------- */
function safeHost(u){try{return new URL(u).host;}catch{return '直链';}}
function detect(url){
  const u=url.trim();if(!u)return null;
  if(u.startsWith('magnet:'))return {type:'bt',label:'磁力链接 · 交给 BT 队列',target:'其他文件',host:'DHT 网络'};
  if(/\.torrent($|\?)/i.test(u))return {type:'bt',label:'种子文件 · 交给 BT 队列',target:'其他文件',host:'torrent'};
  if(/huggingface|hf-mirror|modelscope|civitai/i.test(u))return {type:'model',label:'模型文件 · 自动归类到 ComfyUI 目录',target:'diffusion_models',host:safeHost(u)};
  if(/youtube|bilibili|m3u8|mpd|\.mp4/i.test(u))return {type:'video',label:'视频 · yt-dlp 解析后分片下载',target:'视频',host:safeHost(u)};
  if(/\.zip|\.rar|\.7z/i.test(u))return {type:'zip',label:'压缩包 · 归档到「压缩包」',target:'压缩包',host:safeHost(u)};
  if(/\.exe|\.msi|\.iso/i.test(u))return {type:'app',label:'软件 / 镜像 · 归档到「其他文件」',target:'其他文件',host:safeHost(u)};
  return {type:'app',label:'普通下载 · 归档到「其他文件」',target:'其他文件',host:safeHost(u)};
}
function updateDetect(){
  const d=detect($('#urlInput')?.value||''),chip=$('#detectChip');
  if(!chip)return d;
  if(d){chip.classList.add('show');$('#detectText').textContent=d.label;}else chip.classList.remove('show');
  return d;
}
function fileNameFrom(u){
  try{const p=new URL(u).pathname.split('/').filter(Boolean).pop();return p?decodeURIComponent(p).split('?')[0]:'downloaded-file.bin';}
  catch{return u.slice(-40)||'downloaded-file.bin';}
}
function addTask(url,d){
  const name=fileNameFrom(url);
  const t={id:uid(),name:name.length>4?name:'downloaded-file',url,type:d.type,host:d.host,target:d.target,
    size:d.type==='model'?6200+Math.random()*18000:200+Math.random()*2400,done:0,status:'active',
    speed:8+Math.random()*22,added:new Date().toTimeString().slice(0,5),
    folder:(d.type==='model'?S.settings.modelsDir:S.settings.downloadDir)+'/'+(d.target||'')};
  S.tasks.unshift(t);S.page='workbench';S.filter='all';
  log(`新建任务 ${t.name} → ${t.folder}`,'i');toast('已加入队列：'+t.name,'ok');renderMain();
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('#popover'))hidePopover();return;}
  const act=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  const t=S.tasks.find(x=>x.id===id);
  hidePopover();

  switch(act){
    case 'nav': S.page=el.dataset.page;S.selected.clear();renderMain();break;
    case 'win-min': toast('窗口已最小化（原型模拟）');break;
    case 'win-max': toast('已切换最大化 / 还原（原型模拟）');break;
    case 'win-close':
      if(S.settings.closeBehavior==='直接退出')toast('直接退出（原型模拟）');
      else if(S.settings.closeBehavior==='收进托盘继续运行')toast('已收进托盘，下载继续','ok');
      else confirmBox('关闭窗口','下载任务还在进行，你希望怎么做？',[
        {label:'取消',fn:()=>{}},{label:'直接退出',fn:()=>toast('直接退出（原型模拟）')},
        {label:'收进托盘',cls:'btn-solid',fn:()=>toast('已收进托盘，下载继续','ok')}]);
      break;
    case 'new-task':
      S.page='workbench';renderMain();
      requestAnimationFrame(()=>{const i=$('#urlInput');if(i){i.focus();i.scrollIntoView({block:'center',behavior:'smooth'});}});
      toast('已回到工作台，输入框已聚焦','ok');break;

    /* 顶栏全局 */
    case 'theme-toggle':
      S.theme=S.theme==='dark'?'light':'dark';S.settings.darkMode=S.theme==='dark';
      applyTheme();renderTitlebar();renderSidebar();
      toast('已切换到'+(S.theme==='dark'?'深色':'浅色')+'主题','ok');log('切换主题','i');break;
    case 'palette-menu': showPalettePopover(el);break;
    case 'set-palette':
      S.palette=v;applyTheme();renderTitlebar();renderStatusbar();renderMain();
      toast('已切换配色：'+PALETTES[v].name,'ok');log('切换配色 '+PALETTES[v].name,'i');break;
    case 'donate': openDonate();break;
    case 'design-notes': openDesignNotes();break;
    case 'self-check': {
      const n=$$('[data-act]').length;
      $$('[data-act]').forEach((x,i)=>setTimeout(()=>{x.classList.add('flash');setTimeout(()=>x.classList.remove('flash'),900);},Math.min(i*4,900)));
      toast(`交互自检：当前页面 ${n} 个可点控件，全部已绑定 ✓`,'ok');log(`交互自检通过：${n} 个控件`,'o');break;
    }

    /* 捕获区 */
    case 'paste': {
      $('#urlInput').value='https://huggingface.co/Comfy-Org/flux1-schnell/resolve/main/flux1-schnell-fp8.safetensors';
      updateDetect();toast('已粘贴示例链接');log('从剪贴板粘贴链接','i');break;
    }
    case 'clear-url': $('#urlInput').value='';updateDetect();$('#urlInput').focus();break;
    case 'pick-torrent': toast('已打开 .torrent 选择器（原型模拟）');log('选择种子文件','i');break;
    case 'start-download': {
      const u=$('#urlInput').value.trim();
      if(!u){toast('请先粘贴一条下载链接','bad');$('#urlInput').focus();break;}
      const d=detect(u);
      if(S.settings.askSave){
        confirmBox('确认保存位置',`识别结果：<b>${esc(d.label)}</b><br>将保存到 <code style="font-size:10px">${esc((d.type==='model'?S.settings.modelsDir:S.settings.downloadDir)+'/'+d.target)}</code>`,[
          {label:'取消',fn:()=>{}},{label:'换个位置',fn:()=>toast('已打开目录选择（原型模拟）')},
          {label:'开始下载',cls:'btn-solid',fn:()=>{addTask(u,d);$('#urlInput').value='';updateDetect();}}]);
      }else{addTask(u,d);$('#urlInput').value='';updateDetect();}
      break;
    }
    case 'add-demo': {
      const u='https://hf-mirror.com/black-forest-labs/FLUX.1-schnell/resolve/main/flux1-schnell.safetensors?v='+Math.floor(Math.random()*99);
      addTask(u,detect(u));break;
    }

    /* 工作台 */
    case 'sort': break;
    case 'filter': S.filter=v;renderMain();break;
    case 'select-all': S.tasks.forEach(t=>S.selected.add(t.id));renderMain();toast(`已选中 ${S.selected.size} 项`);break;
    case 'deselect-all': S.selected.clear();renderMain();break;
    case 'task-select': S.selected.has(id)?S.selected.delete(id):S.selected.add(id);renderMain();break;
    case 'batch-pause': {
      let n=0;S.tasks.forEach(t=>{if(t.status==='active'){t.status='paused';t.speed=0;n++;}});

    }
    case 'batch-resume': {
      let n=0;S.tasks.forEach(t=>{if(['paused','queued'].includes(t.status)){t.status='active';t.speed=10+Math.random()*20;n++;}});
      renderMain();log(`批量继续 ${n} 个任务`,'i');toast(n?`已继续 ${n} 个任务`:'没有可继续的任务','ok');break;
    }

        {label:'取消',fn:()=>{}},

          const ids=S.selected.size?new Set(S.selected):new Set(S.tasks.filter(t=>t.status==='active').map(t=>t.id));

      URL.revokeObjectURL(a.href);toast('已导出 CSV','ok');log('导出历史 CSV','o');break;
    }
    case 'history-clear': confirmBox('清空历史','将清除全部完成 / 失败 / 已停止的记录，<b>不会删除磁盘上的文件</b>。',[
      {label:'取消',fn:()=>{}},
      {label:'确认清空',cls:'btn-solid danger',fn:()=>{
        S.tasks=S.tasks.filter(t=>!['done','failed'].includes(t.status));S.selected.clear();renderMain();
        toast('历史已清空','ok');log('清空历史记录','e');}}]);break;

    /* BT */
    case 'bt-start': {
      const u=$('#btInput')?.value.trim();
      if(!u){toast('请先粘贴磁力链接','bad');break;}
      const nt={id:uid(),name:'magnet-task-'+Math.floor(Math.random()*900+100),url:u,type:'bt',host:'DHT / PeX',
        target:'其他文件',size:4200,done:0,status:'active',speed:6+Math.random()*12,
        added:new Date().toTimeString().slice(0,5),folder:S.settings.downloadDir+'/其他文件'};
      S.tasks.unshift(nt);$('#btList').innerHTML=activeCard(nt);$('#btCount').textContent='1';
      log('新建 BT 任务 '+u.slice(0,60),'i');toast('BT 任务已加入队列','ok');break;
    }
    case 'bt-pick': toast('已打开 .torrent 选择器（原型模拟）');break;
    case 'bt-stop': $('#btList').innerHTML='<div class="empty"><p>BT 任务已全部停止</p></div>';$('#btCount').textContent='0';toast('已停止全部 BT 任务');break;

    /* 设置 */
    case 'set-nav': {
      S.setSection=v;$$('.set-nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
      const el2=$('#sec-'+v);if(el2)el2.scrollIntoView({behavior:'smooth',block:'start'});break;
    }
    case 'sw': {
      const k=el.dataset.key;S.settings[k]=!S.settings[k];el.classList.toggle('on',S.settings[k]);
      if(k==='darkMode'){S.theme=S.settings[k]?'dark':'light';applyTheme();renderTitlebar();renderSidebar();}
      toast('设置已即时生效','ok');log(`设置 ${k} = ${S.settings[k]}`,'i');break;
    }
    case 'setting-sel': break;
    case 'engine': {
      const labels={open:'打开引擎所在位置',copy:'复制引擎路径',pick:'更换引擎…',portable:'复制到软件目录',reset:'恢复自动检测'};
      if(el.dataset.disabled){toast(el.dataset.disabled);break;}
      toast(labels[v]+'（原型模拟）','ok');log(labels[v],'i');break;
    }
    case 'settings-save': {
      const p=$('#proxyInput');if(p)S.settings.proxy=p.value;
      toast('设置已保存','ok');log('保存设置','o');break;
    }
    case 'settings-reset': confirmBox('恢复默认设置','将把所有开关、下拉与路径恢复为出厂默认值。',[
      {label:'取消',fn:()=>{}},
      {label:'恢复默认',cls:'btn-solid',fn:()=>{
        Object.assign(S.settings,{darkMode:true,autoClassify:true,askSave:true,diskCheck:true,multiSource:true,
          turboSlow:true,preSpeed:false,verifyModel:true,autoUpdate:true,tray:true,sniffBridge:true,autoTune:true,
          connections:'64 线程（极速）',sameName:'重命名保存',closeBehavior:'询问我',quality:'最高清晰度',
          modelsDir:'E:/Comfy-Desktop/ComfyUI-Shared/models',downloadDir:'D:/Downloads/MDV',proxy:''});
        S.theme='dark';S.palette='blue';applyTheme();renderMain();toast('已恢复默认设置','ok');}}]);break;
  }
});

document.addEventListener('change', e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='sort'){S.sort=el.value;renderMain();}
  if(el.dataset.act==='setting-sel'){S.settings[el.dataset.key]=el.value;toast('已设为 '+el.value,'ok');log(`设置 ${el.dataset.key} = ${el.value}`,'i');}
});
document.addEventListener('input', e=>{
  if(e.target.id==='urlInput')updateDetect();
  if(e.target.id==='searchInput'){
    S.search=e.target.value;const pos=e.target.selectionStart;renderMain();
    const n=$('#searchInput');if(n){n.focus();n.setSelectionRange(pos,pos);}
  }
  if(e.target.id==='proxyInput')S.settings.proxy=e.target.value;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if($('#modal').classList.contains('show'))closeModal();
    else if($('#sheet').classList.contains('show'))closeSheet();
    else if(S.logOpen){S.logOpen=false;$('#drawer').classList.remove('show');renderStatusbar();}
  }
  if(e.key==='Enter'&&e.target.id==='urlInput')$('[data-act="start-download"]')?.click();
});
$('#overlay').addEventListener('click',()=>{closeSheet();closeModal();});

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault();const c=$('#capture');if(c)c.classList.add('dragover');
}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault();if(ev==='dragleave'&&e.relatedTarget)return;
  const c=$('#capture');if(c)c.classList.remove('dragover');
}));
document.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer?.files?.[0];
  if(f){
    const name=f.name.toLowerCase();
    if($('#urlInput')){$('#urlInput').value=f.name;updateDetect();}
    toast('已接收：'+f.name,'ok');log('拖入文件 '+f.name,'i');
    if(name.endsWith('.torrent')){S.page='bt';renderMain();if($('#btInput'))$('#btInput').value='file://'+f.name;}
  }else{
    const text=e.dataTransfer?.getData('text');
    if(text&&$('#urlInput')){$('#urlInput').value=text;updateDetect();toast('已接收拖入的链接','ok');}
  }
});

$$('[data-icon]').forEach(el=>{el.innerHTML=ico(el.dataset.icon,'sm');});
renderAll();
setInterval(tick,800);
log('界面就绪 · v2 冰蓝配色','o');
</script>
</body>
</html>
