# 打 tag 自动构建并发布到 GitHub Releases
#
# 用法：git tag v1.0.0 && git push origin v1.0.0
#
# 产出三个东西：
#   1. MDVTool-x.y.z.exe   单文件，双击即用
#   2. MDVTool-x.y.z.zip   绿色版，解压即用（含 README / LICENSE）
#   3. SHA-256 写进 Release 正文
#
# 构建完成后记得把 version.json 的 version / size / notes 改成新版本并提交，
# 客户端下次启动才会看到「新版本可用」。

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 发布单文件
        run: >
          dotnet publish src/MDVTool.Desktop/MDVTool.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: 重命名产物并算哈希
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $src = "out/MDVTool.exe"
          $dst = "out/MDVTool-$tag.exe"
          Move-Item $src $dst
          $size = (Get-Item $dst).Length
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "asset=$dst" >> $env:GITHUB_ENV
          "size=$size" >> $env:GITHUB_ENV
          "sha=$hash" >> $env:GITHUB_ENV
          Write-Host "大小: $size"
          Write-Host "SHA256: $hash"

      - name: 打包绿色版 ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Path pkg -Force | Out-Null
          Copy-Item "out/MDVTool-$tag.exe" pkg/
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path "pkg/*" -DestinationPath "out/MDVTool-$tag.zip" -Force
          "zipfile=out/MDVTool-$tag.zip" >> $env:GITHUB_ENV

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          files: |
            ${{ env.asset }}
            ${{ env.zipfile }}
          body: |
            **下载方式**

            - `MDVTool-${{ github.ref_name }}.zip` —— 绿色版，解压即用（推荐）
            - `${{ env.asset }}` —— 单文件，双击即用

            仅支持 Windows 10 / 11（64 位），无需安装 .NET 运行时。

            SHA-256：`${{ env.sha }}`
            大小：`${{ env.size }}` 字节
